package:
  name: env
  publish:
    version: 0.1.0
    license: MIT
    location:
      githubOwner: m-rinaldi
      githubRepo: purescript-env
  dependencies:
    - bifunctors: ">=6.1.0 <7.0.0"
    - effect: ">=4.0.0 <5.0.0"
    - either: ">=6.1.0 <7.0.0"
    - exceptions: ">=6.1.0 <7.0.0"
    - foldable-traversable: ">=6.0.0 <7.0.0"
    - foreign: ">=7.0.0 <8.0.0"
    - foreign-object: ">=4.1.0 <5.0.0"
    - integers: ">=6.0.0 <7.0.0"
    - lists: ">=7.0.0 <8.0.0"
    - maybe: ">=6.0.0 <7.0.0"
    - node-process: ">=11.3.0 <12.0.0"
    - numbers: ">=9.0.1 <10.0.0"
    - prelude: ">=6.0.2 <7.0.0"
    - record: ">=4.0.0 <5.0.0"
    - strings: ">=6.0.1 <7.0.0"
    - transformers: ">=6.1.0 <7.0.0"
    - typelevel-prelude: ">=7.0.0 <8.0.0"
  test:
    main: Test.Env.Main
    dependencies:
      - aff
      - spec
      - spec-node

workspace:
  packageSet:
    registry: 81.1.0
  extraPackages:
    # `node-process` 11.3.0 is the release with `loadEnvFile` (purescript-node/purescript-node-process#47),
    # newer than the package set's 11.2.0. Drop this entry once a package set carries it.
    node-process: 11.3.0
