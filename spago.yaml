package:
  name: env
  publish:
    version: 0.1.0
    license: MIT
    location:
      githubOwner: m-rinaldi
      githubRepo: purescript-env
  dependencies:
    - bifunctors
    - effect
    - either
    - exceptions
    - foldable-traversable
    - foreign
    - foreign-object
    - integers
    - lists
    - maybe
    - node-process: ">=11.3.0 <12.0.0"
    - numbers
    - prelude
    - record
    - strings
    - transformers
    - typelevel-prelude
  test:
    main: Test.Env.Main
    dependencies:
      - aff
      - spec
      - spec-node

workspace:
  packageSet:
    registry: 81.1.0
  extraPackages:
    # `node-process` 11.3.0 is the release with `loadEnvFile` (purescript-node/purescript-node-process#47),
    # newer than the package set's 11.2.0. Drop this entry once a package set carries it.
    node-process: 11.3.0
